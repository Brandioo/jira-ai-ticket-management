name: jira-ai-ticket-management-backend
type: php
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm
database:
  type: mysql
  version: "8.0"
use_dns_when_possible: true
composer_version: "2"
router_http_port: "80"
router_https_port: "443"
web_environment:
  - APP_ENV=local
  - DB_CONNECTION=mysql
  - DB_HOST=db
  - DB_PORT=3306
  - DB_DATABASE=db
  - DB_USERNAME=db
  - DB_PASSWORD=db
